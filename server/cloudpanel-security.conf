# Paste inside EACH server { } block serving this app in CloudPanel's Vhost Editor.
# Place before existing regex location blocks (including static-file caching).
# These rules are not automatically applied by uploading this file.
location ~ /\.(?!well-known(?:/|$)) {
    deny all;
    access_log off;
    log_not_found off;
}
location ~* /server/licenses\.json$ {
    deny all;
}
