<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gradient Studio — ChromaForge AI</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="../assets/favicon.svg">
<meta name="author" content="ChromaForge AI">
<meta name="description" content="Design stunning linear, radial, and conic gradients with multi-stop controls and CSS export.">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans'],mono:['Space Mono']},colors:{brand:{500:'#6366f1'},surface:{light:'#f8fafc',dark:'#0c0c0f'},card:{light:'#fff',dark:'#16161a'}}}}}</script>
<link rel="stylesheet" href="../css/style.css"><script src="../js/config.js"></script><script src="../js/license.js"></script><script src="../js/core.min.js"></script><script src="../js/whitelabel.js"></script>
<style>.gh{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:grab;transform:translate(-50%,-50%);top:50%;z-index:10;transition:box-shadow .2s}.gh:hover,.gh.sel{box-shadow:0 0 0 3px rgba(99,102,241,0.5),0 2px 8px rgba(0,0,0,0.3)}</style></head>
<body class="bg-surface-light text-slate-800 dark:bg-surface-dark dark:text-slate-200"><div class="noise-overlay"></div>
<header class="fixed top-0 left-0 z-50 w-full bg-white/80 dark:bg-card-dark/80 backdrop-blur-xl border-b border-slate-100 dark:border-slate-800"><nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3"><div class="flex items-center gap-4"><a href="../index.html" class="text-slate-500 hover:text-brand-500 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Home</a><span class="text-slate-300 dark:text-slate-700">|</span><span class="text-lg font-bold"><span class="gradient-text">Gradient</span> Studio</span></div><button onclick="CFUtils.toggleTheme()" class="h-8 w-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i id="theme-icon" class="fa-solid fa-moon text-slate-600 text-sm"></i></button></nav></header>
<main class="pt-24 pb-20 max-w-5xl mx-auto px-6">
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-2"><div id="gp" class="w-full rounded-2xl shadow-xl relative overflow-hidden flex items-center justify-center" style="height:380px"><h1 class="text-4xl font-bold text-white mix-blend-overlay pointer-events-none opacity-70">Beautiful Gradients</h1></div>
<div class="mt-4 p-4 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><div id="tc" class="relative h-8 rounded-lg cursor-crosshair" ondblclick="addStop(event)"><div id="gt" class="absolute inset-0 rounded-lg"></div></div><p class="text-[10px] text-slate-400 mt-2 text-center">Double-click to add stops</p></div>
<div class="mt-4 p-4 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><div class="flex items-center justify-between mb-2"><span class="text-xs font-bold text-slate-500 uppercase tracking-wider">CSS</span><button onclick="CFUtils.copyText(document.getElementById('css').textContent)" class="text-xs text-brand-500 font-semibold"><i class="fa-regular fa-copy mr-1"></i>Copy</button></div><pre id="css" class="font-mono text-xs text-slate-600 dark:text-slate-400 whitespace-pre-wrap"></pre></div></div>
<div class="space-y-4">
<div class="p-4 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><label class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 block">Type</label><div class="grid grid-cols-3 gap-1 p-1 rounded-lg bg-slate-100 dark:bg-slate-800"><button onclick="setT('linear')" id="bt-linear" class="py-2 text-xs font-bold rounded-md bg-white dark:bg-card-dark text-brand-500 shadow-sm">Linear</button><button onclick="setT('radial')" id="bt-radial" class="py-2 text-xs font-bold rounded-md text-slate-500">Radial</button><button onclick="setT('conic')" id="bt-conic" class="py-2 text-xs font-bold rounded-md text-slate-500">Conic</button></div></div>
<div class="p-4 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><label class="text-xs font-bold uppercase text-slate-500 mb-2 block">Stop Color</label><div class="flex gap-3 mb-3"><input type="color" id="sc" class="h-10 w-10 rounded-lg cursor-pointer" oninput="updCol(this.value)"><input type="text" id="sh" class="flex-1 px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-sm" oninput="if(chroma.valid(this.value))updCol(this.value)"></div><div class="flex items-center gap-2"><span class="text-xs text-slate-400">Pos:</span><input type="range" id="sp" min="0" max="100" class="flex-1" oninput="updPos(this.value)"><span id="spd" class="text-xs font-mono text-slate-500 w-10 text-right">50%</span></div><button onclick="delStop()" class="w-full mt-3 py-2 text-xs font-semibold rounded-lg border border-red-200 dark:border-red-900 text-red-500 hover:bg-red-500/10"><i class="fa-solid fa-trash mr-1"></i>Remove</button></div>
<div id="ag" class="p-4 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><label class="text-xs font-bold uppercase text-slate-500 mb-2 block">Angle</label><div class="flex items-center gap-3"><input type="range" id="ai" min="0" max="360" value="90" class="flex-1" oninput="G.angle=+this.value;render()"><span id="ad" class="text-xs font-mono text-slate-500 w-10 text-right">90°</span></div></div>
<div class="grid grid-cols-2 gap-2"><button onclick="rand()" class="py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold hover:border-brand-500 hover:text-brand-500"><i class="fa-solid fa-shuffle mr-1"></i>Random</button><button onclick="CFUtils.copyText(document.getElementById('css').textContent)" class="py-3 rounded-xl bg-brand-500 text-white text-sm font-semibold"><i class="fa-solid fa-copy mr-1"></i>CSS</button></div>
</div></div></main><div id="cf-toast" class="translate-y-20 opacity-0"></div>
<script>
let G={type:'linear',angle:90,stops:[{id:'s1',color:'#6366f1',pos:0},{id:'s2',color:'#ec4899',pos:50},{id:'s3',color:'#f59e0b',pos:100}],sel:'s1'},dragId=null;
document.addEventListener('DOMContentLoaded',()=>{CFUtils.initTheme();render()});
function render(){const sorted=[...G.stops].sort((a,b)=>a.pos-b.pos),gs=sorted.map(s=>`${s.color} ${s.pos}%`).join(', ');
let css;if(G.type==='linear')css=`linear-gradient(${G.angle}deg, ${gs})`;else if(G.type==='radial')css=`radial-gradient(circle, ${gs})`;else css=`conic-gradient(from ${G.angle}deg, ${gs})`;
document.getElementById('gp').style.background=css;document.getElementById('gt').style.background=`linear-gradient(90deg, ${gs})`;document.getElementById('css').textContent=`background: ${css};`;document.getElementById('ad').textContent=G.angle+'°';document.getElementById('ag').style.display=G.type==='radial'?'none':'block';
const sel=G.stops.find(s=>s.id===G.sel);if(sel){document.getElementById('sc').value=sel.color;document.getElementById('sh').value=sel.color;document.getElementById('sp').value=sel.pos;document.getElementById('spd').textContent=Math.round(sel.pos)+'%'}
const tc=document.getElementById('tc');tc.querySelectorAll('.gh').forEach(h=>h.remove());G.stops.forEach(s=>{const h=document.createElement('div');h.className=`gh ${s.id===G.sel?'sel':''}`;h.style.left=s.pos+'%';h.style.backgroundColor=s.color;h.onpointerdown=e=>startDrag(e,s.id);h.onclick=e=>{e.stopPropagation();G.sel=s.id;render()};tc.appendChild(h)});
['linear','radial','conic'].forEach(t=>{const b=document.getElementById('bt-'+t);b.className=t===G.type?'py-2 text-xs font-bold rounded-md bg-white dark:bg-card-dark text-brand-500 shadow-sm':'py-2 text-xs font-bold rounded-md text-slate-500'})}
function startDrag(e,id){e.preventDefault();dragId=id;G.sel=id;const mv=ev=>{const r=document.getElementById('tc').getBoundingClientRect();const s=G.stops.find(s=>s.id===dragId);if(s){s.pos=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));render()}};const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dragId=null};document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up)}
function addStop(e){const r=document.getElementById('tc').getBoundingClientRect(),pos=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));const sorted=[...G.stops].sort((a,b)=>a.pos-b.pos);const sc=chroma.scale(sorted.map(s=>s.color)).domain(sorted.map(s=>s.pos/100));const nid='s'+Date.now();G.stops.push({id:nid,color:sc(pos/100).hex(),pos});G.sel=nid;render()}
function setT(t){G.type=t;render()}function updCol(v){const s=G.stops.find(s=>s.id===G.sel);if(s&&chroma.valid(v)){s.color=chroma(v).hex();render()}}function updPos(v){const s=G.stops.find(s=>s.id===G.sel);if(s){s.pos=+v;render()}}function delStop(){if(G.stops.length<=2)return CFUtils.showToast('Min 2 stops','error');G.stops=G.stops.filter(s=>s.id!==G.sel);G.sel=G.stops[0].id;render()}
function rand(){const h=Math.random()*360;const c=[chroma.hsl(h,.7,.5).hex(),chroma.hsl((h+40)%360,.8,.4).hex(),chroma.hsl((h+180)%360,.6,.6).hex()];G.stops=c.map((c,i)=>({id:'s'+Date.now()+i,color:c,pos:(i/(c.length-1))*100}));G.angle=Math.floor(Math.random()*360);G.sel=G.stops[0].id;render()}
</script></body></html>
