<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Inspector — ChromaForge AI</title>
<meta name="author" content="ChromaForge AI">
<meta name="description" content="Inspect any color: Tailwind scale, shades, tints, tones, RGB, HSL, CMYK, and more.">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans'],mono:['Space Mono']},colors:{brand:{500:'#6366f1'},surface:{light:'#f8fafc',dark:'#0c0c0f'},card:{light:'#fff',dark:'#16161a'}}}}}</script>
<link rel="stylesheet" href="../css/style.css"><script src="../js/config.js"></script><script src="../js/license.js"></script><script src="../js/core.min.js"></script><script src="../js/whitelabel.js"></script></head>
<body class="bg-surface-light text-slate-800 dark:bg-surface-dark dark:text-slate-200"><div class="noise-overlay"></div>
<header class="fixed top-0 left-0 z-50 w-full bg-white/80 dark:bg-card-dark/80 backdrop-blur-xl border-b border-slate-100 dark:border-slate-800"><nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3"><div class="flex items-center gap-4"><a href="../index.html" class="text-slate-500 hover:text-brand-500 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Home</a><span class="text-slate-300 dark:text-slate-700">|</span><span class="text-lg font-bold"><span class="gradient-text">Color</span> Inspector</span></div><button onclick="CFUtils.toggleTheme()" class="h-8 w-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i id="theme-icon" class="fa-solid fa-moon text-slate-600 text-sm"></i></button></nav></header>
<main class="pt-24 pb-20 max-w-5xl mx-auto px-6">
<div class="flex items-center gap-4 mb-10 justify-center"><input type="color" id="ci" value="#6366f1" class="h-14 w-14 rounded-xl cursor-pointer" oninput="inspect(this.value)"><input type="text" id="hi" value="#6366f1" class="px-5 py-3 rounded-xl bg-white dark:bg-card-dark border border-slate-200 dark:border-slate-700 font-mono text-xl font-bold uppercase w-40 text-center" oninput="if(chroma.valid(this.value))inspect(this.value)"><button onclick="inspect(chroma.random().hex())" class="px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold hover:border-brand-500 hover:text-brand-500"><i class="fa-solid fa-shuffle mr-1"></i>Random</button></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10"><div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><div id="sw" class="w-full h-32 rounded-xl mb-4 shadow-lg" style="background:#6366f1"></div><h2 id="cn" class="text-xl font-bold text-slate-900 dark:text-white">SlateBlue</h2><p id="ch" class="font-mono text-sm text-slate-400 uppercase">#6366F1</p></div>
<div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><h3 class="text-xs font-bold uppercase text-slate-400 mb-4">Channels</h3><div id="chn" class="space-y-3"></div></div>
<div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><h3 class="text-xs font-bold uppercase text-slate-400 mb-4">Properties</h3><div id="props" class="space-y-3"></div></div></div>
<div class="mb-10"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-bold text-slate-900 dark:text-white">Tailwind Scale</h2><button onclick="copyTW()" class="text-xs text-brand-500 font-semibold"><i class="fa-regular fa-copy mr-1"></i>Copy</button></div><div id="tw" class="grid grid-cols-11 gap-2"></div></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10"><div><h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Shades</h2><div id="shades" class="space-y-1"></div></div><div><h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Tints</h2><div id="tints" class="space-y-1"></div></div></div>
<div class="mb-10"><h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Tones</h2><div id="tones" class="flex gap-1 h-16 rounded-xl overflow-hidden"></div></div>
</main><div id="cf-toast" class="translate-y-20 opacity-0"></div>
<script>
let cur='#6366f1';document.addEventListener('DOMContentLoaded',()=>{CFUtils.initTheme();inspect('#6366f1')});
function inspect(hex){if(!chroma.valid(hex))return;cur=chroma(hex).hex();document.getElementById('ci').value=cur;document.getElementById('hi').value=cur.toUpperCase();document.getElementById('sw').style.background=cur;document.getElementById('cn').textContent=CFUtils.getColorName(cur);document.getElementById('ch').textContent=cur.toUpperCase();
const c=chroma(cur),[r,g,b]=c.rgb(),[h,s,l]=c.hsl(),[hv,sv,v]=c.hsv(),[cm,m,y,k]=c.cmyk();
document.getElementById('chn').innerHTML=[{l:'RGB',v:`${r}, ${g}, ${b}`},{l:'HSL',v:`${(h||0).toFixed(0)}°, ${(s*100).toFixed(0)}%, ${(l*100).toFixed(0)}%`},{l:'HSV',v:`${(hv||0).toFixed(0)}°, ${(sv*100).toFixed(0)}%, ${(v*100).toFixed(0)}%`},{l:'CMYK',v:`${(cm*100).toFixed(0)}, ${(m*100).toFixed(0)}, ${(y*100).toFixed(0)}, ${(k*100).toFixed(0)}`}].map(i=>`<div class="flex justify-between text-sm"><span class="text-slate-400">${i.l}</span><span class="font-mono text-slate-700 dark:text-slate-300">${i.v}</span></div>`).join('');
document.getElementById('props').innerHTML=[{l:'Luminance',v:(c.luminance()*100).toFixed(1)+'%'},{l:'vs White',v:chroma.contrast(cur,'white').toFixed(2)+':1'},{l:'vs Black',v:chroma.contrast(cur,'black').toFixed(2)+':1'}].map(i=>`<div class="flex justify-between text-sm"><span class="text-slate-400">${i.l}</span><span class="font-mono text-slate-700 dark:text-slate-300">${i.v}</span></div>`).join('');
// Tailwind scale
const steps=[50,100,200,300,400,500,600,700,800,900,950];document.getElementById('tw').innerHTML=steps.map(st=>{let cl;if(st===500)cl=chroma(cur);else if(st<500)cl=chroma.mix(cur,'white',(500-st)/550,'rgb');else cl=chroma.mix(cur,'black',(st-500)/550*.8,'rgb');const hx=cl.hex(),il=cl.luminance()>.5;return`<div class="text-center cursor-pointer hover:scale-105 transition-transform" onclick="CFUtils.copyText('${hx}')"><div class="h-16 rounded-xl mb-2 shadow-sm ${il?'border border-slate-200':''}" style="background:${hx}"></div><div class="text-xs font-bold text-slate-500">${st}</div><div class="text-[10px] font-mono text-slate-400">${hx}</div></div>`}).join('');
// Shades & Tints
document.getElementById('shades').innerHTML=Array.from({length:8},(_,i)=>{const hx=chroma.mix(cur,'black',i/7*.85,'rgb').hex();return`<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer" onclick="CFUtils.copyText('${hx}')"><div class="w-10 h-10 rounded-lg" style="background:${hx}"></div><span class="font-mono text-xs text-slate-500">${hx}</span></div>`}).join('');
document.getElementById('tints').innerHTML=Array.from({length:8},(_,i)=>{const hx=chroma.mix(cur,'white',i/7*.9,'rgb').hex();return`<div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer" onclick="CFUtils.copyText('${hx}')"><div class="w-10 h-10 rounded-lg ${chroma(hx).luminance()>.9?'border border-slate-200':''}" style="background:${hx}"></div><span class="font-mono text-xs text-slate-500">${hx}</span></div>`}).join('');
document.getElementById('tones').innerHTML=Array.from({length:10},(_,i)=>{const hx=chroma(cur).desaturate(i*.5).hex();return`<div class="flex-1 cursor-pointer hover:scale-y-110 transition-transform" style="background:${hx}" title="${hx}" onclick="CFUtils.copyText('${hx}')"></div>`}).join('')}
function copyTW(){const steps=[50,100,200,300,400,500,600,700,800,900,950];const cfg=steps.map(st=>{let cl;if(st===500)cl=chroma(cur);else if(st<500)cl=chroma.mix(cur,'white',(500-st)/550,'rgb');else cl=chroma.mix(cur,'black',(st-500)/550*.8,'rgb');return`  ${st}: '${cl.hex()}'`}).join(',\n');CFUtils.copyText(`brand: {\n${cfg}\n}`)}
</script></body></html>
