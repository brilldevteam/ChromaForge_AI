<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contrast Checker — ChromaForge AI</title>
<meta name="author" content="ChromaForge AI">
<meta name="description" content="Check WCAG 2.1 AA/AAA color contrast compliance with suggestions and color blindness simulation.">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['DM Sans'],mono:['Space Mono']},colors:{brand:{500:'#6366f1'},surface:{light:'#f8fafc',dark:'#0c0c0f'},card:{light:'#fff',dark:'#16161a'}}}}}</script>
<link rel="stylesheet" href="../css/style.css"><script src="../js/config.js"></script><script src="../js/license.js"></script><script src="../js/core.min.js"></script><script src="../js/whitelabel.js"></script></head>
<body class="bg-surface-light text-slate-800 dark:bg-surface-dark dark:text-slate-200"><div class="noise-overlay"></div>
<header class="fixed top-0 left-0 z-50 w-full bg-white/80 dark:bg-card-dark/80 backdrop-blur-xl border-b border-slate-100 dark:border-slate-800"><nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3"><div class="flex items-center gap-4"><a href="../index.html" class="text-slate-500 hover:text-brand-500 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Home</a><span class="text-slate-300 dark:text-slate-700">|</span><span class="text-lg font-bold"><span class="gradient-text">Contrast</span> Checker</span></div><button onclick="CFUtils.toggleTheme()" class="h-8 w-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i id="theme-icon" class="fa-solid fa-moon text-slate-600 text-sm"></i></button></nav></header>
<main class="pt-24 pb-20 max-w-4xl mx-auto px-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8"><div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><label class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 block">Foreground (Text)</label><div class="flex items-center gap-3"><input type="color" id="fc" value="#1e293b" class="h-12 w-12 rounded-lg cursor-pointer" oninput="upd()"><input type="text" id="fh" value="#1e293b" class="flex-1 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-lg font-bold uppercase" oninput="if(chroma.valid(this.value)){document.getElementById('fc').value=chroma(this.value).hex();upd()}"></div></div><div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><label class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3 block">Background</label><div class="flex items-center gap-3"><input type="color" id="bc" value="#ffffff" class="h-12 w-12 rounded-lg cursor-pointer" oninput="upd()"><input type="text" id="bh" value="#ffffff" class="flex-1 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono text-lg font-bold uppercase" oninput="if(chroma.valid(this.value)){document.getElementById('bc').value=chroma(this.value).hex();upd()}"></div></div></div>
<div class="text-center mb-8"><button onclick="const f=document.getElementById('fc').value,b=document.getElementById('bc').value;document.getElementById('fc').value=b;document.getElementById('fh').value=b;document.getElementById('bc').value=f;document.getElementById('bh').value=f;upd()" class="px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm font-semibold text-slate-500 hover:text-brand-500"><i class="fa-solid fa-arrows-rotate mr-2"></i>Swap</button></div>
<div id="prev" class="rounded-2xl p-8 mb-8 shadow-xl" style="background:#fff"><h2 id="pvh" class="text-4xl font-bold mb-2" style="color:#1e293b">The quick brown fox</h2><p id="pvb" class="text-lg mb-4" style="color:#1e293b">jumps over the lazy dog. This is how your text looks.</p><p id="pvs" class="text-sm" style="color:#1e293b">Small text at 14px — WCAG requires higher ratios for small text.</p></div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8"><div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800 text-center"><div class="text-xs font-bold uppercase text-slate-400 mb-3">Ratio</div><div id="ratio" class="text-5xl font-bold text-slate-900 dark:text-white">21:1</div></div>
<div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><div class="text-xs font-bold uppercase text-slate-400 mb-4">WCAG AA</div><div class="space-y-3"><div class="flex justify-between"><span class="text-sm text-slate-500">Normal</span><span id="aa-n" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500">PASS</span></div><div class="flex justify-between"><span class="text-sm text-slate-500">Large</span><span id="aa-l" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500">PASS</span></div></div></div>
<div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><div class="text-xs font-bold uppercase text-slate-400 mb-4">WCAG AAA</div><div class="space-y-3"><div class="flex justify-between"><span class="text-sm text-slate-500">Normal</span><span id="aaa-n" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500">PASS</span></div><div class="flex justify-between"><span class="text-sm text-slate-500">Large</span><span id="aaa-l" class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500">PASS</span></div></div></div></div>
<div class="p-6 rounded-xl bg-white dark:bg-card-dark border border-slate-100 dark:border-slate-800"><h3 class="text-sm font-bold mb-4"><i class="fa-solid fa-lightbulb text-amber-500 mr-2"></i>Suggestions</h3><div id="sugg" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div></div>
</main><div id="cf-toast" class="translate-y-20 opacity-0"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{CFUtils.initTheme();upd()});
function upd(){const fg=document.getElementById('fc').value,bg=document.getElementById('bc').value;document.getElementById('fh').value=fg;document.getElementById('bh').value=bg;const r=chroma.contrast(fg,bg);
document.getElementById('prev').style.background=bg;['pvh','pvb','pvs'].forEach(id=>document.getElementById(id).style.color=fg);
document.getElementById('ratio').textContent=r.toFixed(2)+':1';
const badge=(id,ok)=>{const e=document.getElementById(id);e.textContent=ok?'PASS':'FAIL';e.className=`text-xs font-bold px-3 py-1 rounded-full ${ok?'bg-emerald-500/10 text-emerald-500':'bg-red-500/10 text-red-500'}`};
badge('aa-n',r>=4.5);badge('aa-l',r>=3);badge('aaa-n',r>=7);badge('aaa-l',r>=4.5);
// Suggestions
const sg=[];for(let i=1;i<=5;i++){const c=chroma(fg).darken(i*.5).hex();if(chroma.contrast(c,bg)>=4.5){sg.push({fg:c,bg});break}}
for(let i=1;i<=5;i++){const c=chroma(fg).brighten(i*.5).hex();if(chroma.contrast(c,bg)>=4.5){sg.push({fg:c,bg});break}}
for(let i=1;i<=5;i++){const c=chroma(bg).darken(i*.5).hex();if(chroma.contrast(fg,c)>=4.5){sg.push({fg,bg:c});break}}
for(let i=1;i<=5;i++){const c=chroma(bg).brighten(i*.5).hex();if(chroma.contrast(fg,c)>=4.5){sg.push({fg,bg:c});break}}
document.getElementById('sugg').innerHTML=sg.map(s=>`<div class="rounded-xl overflow-hidden cursor-pointer hover:-translate-y-1 transition-all shadow-sm hover:shadow-lg" onclick="document.getElementById('fc').value='${s.fg}';document.getElementById('fh').value='${s.fg}';document.getElementById('bc').value='${s.bg}';document.getElementById('bh').value='${s.bg}';upd()"><div class="h-16 flex items-center justify-center" style="background:${s.bg}"><span class="font-bold text-sm" style="color:${s.fg}">Aa Sample</span></div><div class="p-2 bg-slate-50 dark:bg-slate-800 text-center"><span class="text-[10px] font-mono text-slate-400">${chroma.contrast(s.fg,s.bg).toFixed(1)}:1</span></div></div>`).join('')}
</script></body></html>
