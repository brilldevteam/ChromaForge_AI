<style>.board-preview{box-shadow:0 30px 80px rgba(0,0,0,0.25)}.ctrl-s{border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:14px;margin-bottom:14px}.fsr{cursor:pointer;padding:7px 10px;border-radius:6px;transition:all .15s;font-size:13px}.fsr:hover{background:rgba(99,102,241,0.08)}.ls{border:2px dashed rgba(255,255,255,0.12);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.ls:hover{border-color:rgba(99,102,241,0.4)}.ls img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px}.ls .rm{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(239,68,68,0.9);color:#fff;display:none;align-items:center;justify-content:center;font-size:8px;z-index:5;cursor:pointer}.ls:hover .rm{display:flex}.is{border:2px dashed rgba(255,255,255,0.1);border-radius:10px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.is:hover{border-color:rgba(99,102,241,0.35)}.is img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.is .rm{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(239,68,68,0.9);color:#fff;display:none;align-items:center;justify-content:center;font-size:8px;z-index:5;cursor:pointer}.is:hover .rm{display:flex}</style></head>
<body class="bg-[#0a0a0f] text-slate-200">
<header class="fixed top-0 left-0 z-50 w-full bg-[#0d0d12]/90 backdrop-blur-xl border-b border-white/5"><nav class="mx-auto flex max-w-[1800px] items-center justify-between px-5 py-2.5"><div class="flex items-center gap-4"><a href="../index.html" class="text-slate-400 hover:text-brand-500 text-sm"><i class="fa-solid fa-arrow-left text-xs mr-1"></i>Back</a><span class="text-slate-700">|</span><span class="text-base font-bold"><span class="gradient-text">Brand Board</span> <span class="text-white">Generator</span></span></div><div class="flex items-center gap-2"><button onclick="expPDF()" class="px-4 py-2 rounded-lg bg-red-500/90 hover:bg-red-500 text-white text-xs font-bold"><i class="fa-solid fa-file-pdf mr-1"></i>PDF</button><button onclick="expJPG()" class="px-4 py-2 rounded-lg bg-brand-500/90 hover:bg-brand-500 text-white text-xs font-bold"><i class="fa-solid fa-image mr-1"></i>HD JPG</button></div></nav></header>
<main class="pt-[52px] flex" style="height:100vh">
<div class="w-[350px] min-w-[350px] bg-[#111118] border-r border-white/5 overflow-y-auto" style="height:calc(100vh - 52px)"><div class="p-5 space-y-1">
<div class="ctrl-s"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-1.5 block">Brand Name</label><input type="text" id="n" value="NEWOON" class="w-full px-3 py-2.5 rounded-lg bg-white/5 border border-white/8 text-white font-bold text-sm" oninput="rebuild()"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-1 mt-3 block">Tagline</label><input type="text" id="tl" value="BEYOND THE FUTURE" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/8 text-white text-xs" oninput="rebuild()"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-1 mt-3 block">Description</label><textarea id="ds" rows="2" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/8 text-white text-xs resize-none" oninput="rebuild()">We take innovation seriously. Building worlds from the ground up for an elevated experience.</textarea></div>
<div class="ctrl-s"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-2 block">Logo Variations</label><div class="grid grid-cols-4 gap-2" id="lg"></div></div>
<div class="ctrl-s"><div class="flex items-center justify-between mb-2"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500">Colors</label><button onclick="randP()" class="text-[10px] text-brand-500 font-bold"><i class="fa-solid fa-shuffle mr-1"></i>Random</button></div><div id="cc" class="space-y-2"></div><div class="flex gap-2 mt-2.5"><button onclick="addC()" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg border border-dashed border-white/12 text-slate-400 hover:text-brand-500"><i class="fa-solid fa-plus mr-1"></i>Add</button><button onclick="aiP()" id="aib" class="flex-1 py-1.5 text-[10px] font-bold rounded-lg bg-gradient-to-r from-brand-500 to-pink-500 text-white"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>AI Suggest</button></div></div>
<div class="ctrl-s"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-1.5 block">Heading Font</label><div class="relative mb-2"><input type="text" id="hfs" value="Montserrat" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/8 text-white text-xs" oninput="sF('hf',this.value)" onfocus="sDD('hf')"><div id="hfd" class="hidden absolute z-30 inset-x-0 top-full mt-1 max-h-44 overflow-y-auto bg-[#1a1a24] border border-white/10 rounded-lg shadow-2xl"></div></div><div id="hfp" class="p-2.5 rounded-lg bg-white/3 border border-white/5"><span class="text-xl font-bold text-white" style="font-family:Montserrat">Montserrat</span></div>
<label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-1.5 mt-3 block">Body Font</label><div class="relative mb-2"><input type="text" id="bfs" value="DM Sans" class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/8 text-white text-xs" oninput="sF('bf',this.value)" onfocus="sDD('bf')"><div id="bfd" class="hidden absolute z-30 inset-x-0 top-full mt-1 max-h-44 overflow-y-auto bg-[#1a1a24] border border-white/10 rounded-lg shadow-2xl"></div></div><div id="bfp" class="p-2.5 rounded-lg bg-white/3 border border-white/5"><span class="text-base text-white" style="font-family:'DM Sans'">DM Sans</span></div></div>
<div class="ctrl-s"><label class="text-[10px] font-bold uppercase tracking-[2px] text-slate-500 mb-2 block">Brand Imagery</label><div class="grid grid-cols-3 gap-2" id="ig"></div></div>
<div class="p-3.5 rounded-xl bg-gradient-to-br from-brand-500/8 to-pink-500/5 border border-brand-500/15"><div class="flex items-center gap-2 mb-2"><i class="fa-solid fa-microchip text-brand-400 text-xs"></i><span class="text-[10px] font-bold uppercase tracking-[2px] text-brand-400">AI Full Board</span></div><input type="text" id="aip" placeholder="e.g. Luxury spa, earthy tones..." class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/8 text-white text-xs mb-2"><button onclick="aiF()" id="afb" class="w-full py-2.5 rounded-lg bg-gradient-to-r from-brand-500 to-pink-500 text-white text-xs font-bold"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Generate</button></div>
</div></div>
<div class="flex-1 bg-[#08080c] overflow-y-auto flex items-start justify-center p-6 lg:p-10" style="height:calc(100vh - 52px)"><div class="w-full max-w-[680px]"><div id="bb" class="board-preview bg-white rounded-lg overflow-hidden"></div></div></div>
</main><div id="cf-toast" class="translate-y-20 opacity-0"></div>
<div id="lo" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/60 backdrop-blur-sm"><div class="bg-[#16161a] rounded-2xl p-8 text-center shadow-2xl border border-white/10"><div class="cf-spinner mx-auto mb-4"></div><p class="text-sm font-semibold text-white" id="lm">Processing...</p></div></div>
<script>
const GF=['Archivo','Barlow','Bebas Neue','Bitter','Cabin','Cormorant Garamond','Crimson Text','DM Sans','Fira Sans','IBM Plex Sans','IBM Plex Serif','Josefin Sans','Karla','Lexend','Libre Baskerville','Lora','Manrope','Merriweather','Montserrat','Noto Sans','Nunito','Oswald','Outfit','Plus Jakarta Sans','Playfair Display','Poppins','PT Sans','PT Serif','Quicksand','Raleway','Rubik','Sora','Source Serif 4','Space Grotesk','Space Mono','Urbanist','Work Sans'];
let S={n:'NEWOON',tl:'BEYOND THE FUTURE',ds:'We take innovation seriously. Building worlds from the ground up for an elevated experience.',colors:[{hex:'#B82022',name:'Crimson Core',role:'Primary'},{hex:'#FFFFFF',name:'Pure White',role:'Primary'},{hex:'#0686C1',name:'Ocean Blue',role:'Secondary'},{hex:'#5C9DCE',name:'Sky Mist',role:'Secondary'}],hF:'Montserrat',bF:'DM Sans',logos:[null,null,null,null],imgs:[null,null,null,null,null,null]};
document.addEventListener('DOMContentLoaded',()=>{initLS();initIS();rCC();rebuild();document.addEventListener('click',e=>{if(!e.target.closest('#hfs')&&!e.target.closest('#hfd'))document.getElementById('hfd').classList.add('hidden');if(!e.target.closest('#bfs')&&!e.target.closest('#bfd'))document.getElementById('bfd').classList.add('hidden')})});
function initLS(){const L=['Primary','Secondary','Stacked','Logo Mark'];document.getElementById('lg').innerHTML=L.map((_,i)=>`<div class="text-center"><div class="ls" onclick="this.querySelector('input').click()"><input type="file" accept="image/*" class="hidden" onchange="hL(${i},event)"><i class="fa-solid fa-image text-slate-600 text-[10px]"></i><div class="rm" onclick="event.stopPropagation();rL(${i})"><i class="fa-solid fa-xmark"></i></div></div><span class="text-[7px] text-slate-500 mt-1 block">${L[i]}</span></div>`).join('')}
function hL(i,e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=v=>{S.logos[i]=v.target.result;const s=document.querySelectorAll('.ls')[i];let m=s.querySelector('img');if(!m){m=document.createElement('img');s.appendChild(m)}m.src=v.target.result;rebuild()};r.readAsDataURL(f)}
function rL(i){S.logos[i]=null;const s=document.querySelectorAll('.ls')[i];const m=s.querySelector('img');if(m)m.remove();rebuild()}
function initIS(){document.getElementById('ig').innerHTML=Array.from({length:6},(_,i)=>`<div class="is" onclick="this.querySelector('input').click()"><input type="file" accept="image/*" class="hidden" onchange="hI(${i},event)"><i class="fa-solid fa-plus text-slate-600 text-[9px]"></i><div class="rm" onclick="event.stopPropagation();rI(${i})"><i class="fa-solid fa-xmark"></i></div></div>`).join('')}
function hI(i,e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=v=>{S.imgs[i]=v.target.result;const s=document.querySelectorAll('.is')[i];let m=s.querySelector('img');if(!m){m=document.createElement('img');s.appendChild(m)}m.src=v.target.result;rebuild()};r.readAsDataURL(f)}
function rI(i){S.imgs[i]=null;const s=document.querySelectorAll('.is')[i];const m=s.querySelector('img');if(m)m.remove();rebuild()}
function rCC(){document.getElementById('cc').innerHTML=S.colors.map((c,i)=>`<div class="flex items-center gap-2 p-1.5 rounded-lg bg-white/3 border border-white/5"><input type="color" value="${c.hex}" class="h-7 w-7 rounded cursor-pointer flex-shrink-0" style="padding:0" onchange="S.colors[${i}].hex=this.value;S.colors[${i}].name=CFUtils.getColorName(this.value);rCC();rebuild()"><div class="flex-1 min-w-0"><input type="text" value="${c.name}" class="w-full bg-transparent text-[9px] font-bold text-white border-none p-0" onchange="S.colors[${i}].name=this.value;rebuild()"><div class="flex items-center gap-1"><span class="font-mono text-[8px] text-slate-400 uppercase">${c.hex}</span><select class="bg-transparent text-[7px] text-slate-500 border-none p-0" onchange="S.colors[${i}].role=this.value;rebuild()"><option ${c.role==='Primary'?'selected':''}>Primary</option><option ${c.role==='Secondary'?'selected':''}>Secondary</option><option ${c.role==='Accent'?'selected':''}>Accent</option></select></div></div>${S.colors.length>2?`<button onclick="S.colors.splice(${i},1);rCC();rebuild()" class="text-slate-600 hover:text-red-400 text-[10px]"><i class="fa-solid fa-xmark"></i></button>`:''}</div>`).join('')}
function addC(){if(S.colors.length>=8)return;const h=chroma.random().hex();S.colors.push({hex:h,name:CFUtils.getColorName(h),role:'Secondary'});rCC();rebuild()}
function randP(){const hu=Math.random()*360;S.colors=[{hex:chroma.hsl(hu,.75,.42).hex(),role:'Primary'},{hex:'#FFFFFF',role:'Primary'},{hex:chroma.hsl((hu+140)%360,.6,.5).hex(),role:'Secondary'},{hex:chroma.hsl((hu+200)%360,.5,.6).hex(),role:'Secondary'}];S.colors.forEach(c=>c.name=CFUtils.getColorName(c.hex));rCC();rebuild()}
function sF(id,q){const dd=document.getElementById(id+'d');dd.classList.remove('hidden');const m=q?GF.filter(f=>f.toLowerCase().includes(q.toLowerCase())):GF;dd.innerHTML=m.slice(0,12).map(f=>`<div class="fsr" style="font-family:'${f}'" onclick="selF('${id}','${f}')">${f}</div>`).join('')||'<div class="p-3 text-xs text-slate-500">No match</div>'}
function sDD(id){sF(id,document.getElementById(id+'s').value)}
function selF(id,f){document.getElementById(id+'s').value=f;document.getElementById(id+'d').classList.add('hidden');if(id==='hf'){S.hF=f;document.getElementById('hfp').innerHTML=`<span class="text-xl font-bold text-white" style="font-family:'${f}'">${f}</span>`}else{S.bF=f;document.getElementById('bfp').innerHTML=`<span class="text-base text-white" style="font-family:'${f}'">${f}</span>`}rebuild()}
function rebuild(){S.n=document.getElementById('n').value||'BRAND';S.tl=document.getElementById('tl').value||'';S.ds=document.getElementById('ds').value||'';renderBoard()}
function hRGB(h){return chroma(h).rgb()}function hCMYK(h){const[c,m,y,k]=chroma(h).cmyk();return[Math.round(c*100),Math.round(m*100),Math.round(y*100),Math.round(k*100)]}
function renderBoard(){const bd=document.getElementById('bb'),p=S.colors[0]?.hex||'#333',s2=S.colors[2]?.hex||S.colors[1]?.hex||'#666',ac=S.colors[3]?.hex||s2,tp=chroma.contrast(p,'white')>3?'#fff':'#1a1a1a',ml=S.logos[0]||S.logos[1]||S.logos[2]||S.logos[3],hl=S.logos.some(l=>l),hi=S.imgs.some(i=>i),ai=S.imgs.filter(i=>i);
const cc=S.colors.map(c=>{const[r,g,b]=hRGB(c.hex),cm=hCMYK(c.hex),il=chroma(c.hex).luminance()>0.85,nc=chroma(c.hex).luminance()>0.5?chroma(c.hex).darken(2.5).hex():'#fff';return`<div style="flex:1;min-width:90px"><div style="height:82px;border-radius:10px;background:${c.hex};${il?'border:1px solid #ddd;':''}display:flex;align-items:flex-end;padding:7px 9px;position:relative"><span style="font-family:'${S.hF}',sans-serif;font-size:10px;font-weight:700;color:${nc};text-transform:uppercase;letter-spacing:.3px">${c.name}</span><span style="position:absolute;top:5px;right:7px;font-size:6.5px;font-weight:700;color:${nc};opacity:.55;letter-spacing:1px">${c.role}</span></div><div style="padding:6px 1px 0;font-size:7.5px;color:#999;line-height:1.9"><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:#666">CMYK</span><span>C:${cm[0]} M:${cm[1]} Y:${cm[2]} K:${cm[3]}</span></div><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:#666">RGB</span><span>R:${r} G:${g} B:${b}</span></div><div style="display:flex;justify-content:space-between"><span style="font-weight:700;color:#666">HEX</span><span style="font-weight:600">${c.hex.toUpperCase()}</span></div></div></div>`}).join('');
const ll=['Primary Logo','Secondary Logo','Stacked Logo','Logo Mark'],lu=['Websites, headers, signage.','Printed materials, smaller elements.','When primary doesn\'t fit. Print & web.','Profile pics, stamps, favicon.'];
const lh=hl?`<div style="display:grid;grid-template-columns:repeat(${Math.min(S.logos.filter(l=>l).length,4)},1fr);gap:10px">${S.logos.map((l,i)=>l?`<div style="text-align:center;padding:14px 8px 10px;border:1px solid #eee;border-radius:10px"><div style="font-family:'${S.hF}',sans-serif;font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#aaa;margin-bottom:10px">${ll[i]}</div><img src="${l}" style="max-height:55px;max-width:90%;object-fit:contain;margin:0 auto;display:block"><div style="font-size:6.5px;color:#bbb;margin-top:8px;line-height:1.5"><span style="font-weight:700;color:${p}">USAGE:</span> ${lu[i]}</div></div>`:'').join('')}</div>`:'';
const ih=ai.length?`<div style="display:grid;grid-template-columns:${ai.length>=3?'repeat(3,1fr)':ai.length===2?'1fr 1fr':'1fr'};gap:8px">${ai.map(src=>`<div style="border-radius:10px;overflow:hidden"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`).join('')}</div>`:'';
const dv=(t)=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><div style="height:1px;flex:1;background:linear-gradient(90deg,${p},transparent)"></div><span style="font-family:'${S.hF}',sans-serif;font-size:8.5px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:${p};white-space:nowrap">${t}</span><div style="height:1px;flex:1;background:linear-gradient(270deg,${p},transparent)"></div></div>`;
bd.innerHTML=`<div style="font-family:'${S.bF}',sans-serif;color:#1a1a1a;background:#fff">
<div style="background:${p};padding:${ml?'32px':'44px'} 36px;text-align:center;position:relative;overflow:hidden"><div style="position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:${s2};opacity:.1"></div><div style="position:absolute;bottom:-25px;left:-25px;width:120px;height:120px;border-radius:50%;background:${ac};opacity:.1"></div><div style="position:relative;z-index:1">${ml?`<img src="${ml}" style="max-height:60px;max-width:170px;object-fit:contain;margin:0 auto 12px;display:block">`:''}<div style="font-family:'${S.hF}',sans-serif;font-size:${ml?'26px':'38px'};font-weight:900;color:${tp};letter-spacing:4px;line-height:1.1">${S.n}</div>${S.tl?`<div style="font-size:9.5px;font-weight:600;color:${tp};opacity:.55;letter-spacing:5px;margin-top:7px;text-transform:uppercase">${S.tl}</div>`:''}</div></div>
<div style="padding:26px 32px 32px">
${hl?`${dv('Alternative Logos')}<div style="margin:4px 0 6px;font-size:8px;color:#aaa;font-style:italic">For materials that require a specific placement, style, or shape</div>${lh}<div style="height:20px"></div>`:''}
${dv('Color Palette (Primary & Secondary)')}<div style="margin:3px 0 0;font-size:8px;color:#aaa;font-style:italic">Used alone or in combination to communicate our brand personality</div><div style="display:flex;gap:12px;margin:16px 0 24px">${cc}</div>
${dv('Fonts Guide')}<div style="margin:3px 0 14px;font-size:8px;color:#aaa;font-style:italic">The typeface and font size pairings we have to use</div>

async function aiP(){if(!CFAIEngine.isConfigured())return CFUtils.showToast('AI is unavailable. Please open the hosted application.','error');const b=document.getElementById('aib');b.innerHTML='<div class="cf-spinner mx-auto" style="width:12px;height:12px;border-width:2px"></div>';b.disabled=true;try{const c=await CFAIEngine.generatePalette(S.n+' '+S.tl,4);S.colors=c.map((h,i)=>({hex:h,name:CFUtils.getColorName(h),role:i<2?'Primary':'Secondary'}));rCC();rebuild();CFUtils.showToast('AI palette!')}catch(e){CFUtils.showToast(e.message,'error')}b.innerHTML='<i class="fa-solid fa-wand-magic-sparkles mr-1"></i>AI Suggest';b.disabled=false}
async function aiF(){if(!CFAIEngine.isConfigured())return CFUtils.showToast('AI is unavailable. Please open the hosted application.','error');const pr=document.getElementById('aip').value;if(!pr.trim())return CFUtils.showToast('Enter description','error');showL('AI designing...');try{const b=await CFAIEngine.generateBrandColors(pr,'modern','professional');const nc=[b.primary,b.secondary,b.accent,b.background].filter(c=>chroma.valid(c)).map(h=>chroma(h).hex());S.colors=nc.map((h,i)=>({hex:h,name:CFUtils.getColorName(h),role:i<2?'Primary':'Secondary'}));if(b.name){S.n=b.name.toUpperCase();document.getElementById('n').value=S.n}if(b.description){S.ds=b.description;document.getElementById('ds').value=S.ds}rCC();rebuild();CFUtils.showToast('Board generated!')}catch(e){CFUtils.showToast(e.message,'error')}hideL()}
async function expJPG(){showL('Rendering...');try{await new Promise(r=>setTimeout(r,300));const c=await html2canvas(document.getElementById('bb'),{scale:3,backgroundColor:'#fff',useCORS:true,logging:false,allowTaint:true});const l=document.createElement('a');l.download=S.n.replace(/\s+/g,'-')+'-Brand-Board.jpg';l.href=c.toDataURL('image/jpeg',.95);l.click();CFUtils.showToast('JPG downloaded!')}catch(e){CFUtils.showToast('Failed','error')}hideL()}
async function expPDF(){showL('Generating PDF...');try{await new Promise(r=>setTimeout(r,300));const c=await html2canvas(document.getElementById('bb'),{scale:3,backgroundColor:'#fff',useCORS:true,logging:false,allowTaint:true});const{jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();const ra=Math.min(pw/c.width,ph/c.height);const w=c.width*ra,h=c.height*ra;pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',(pw-w)/2,(ph-h)/2,w,h);pdf.save(S.n.replace(/\s+/g,'-')+'-Brand-Board.pdf');CFUtils.showToast('PDF downloaded!')}catch(e){CFUtils.showToast('Failed','error')}hideL()}
function showL(m){document.getElementById('lm').textContent=m;const o=document.getElementById('lo');o.classList.remove('hidden');o.classList.add('flex')}
function hideL(){const o=document.getElementById('lo');o.classList.add('hidden');o.classList.remove('flex')}
